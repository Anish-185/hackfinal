[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hft-backend"
version = "0.1.0"
description = "FastAPI API and Celery worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    # kombu[redis] (pulled in by celery[redis]) requires redis<6.5.
    "redis==6.4.0",
    "celery[redis]==5.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
    "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
