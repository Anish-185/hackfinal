# App stack: MongoDB, Redis, API (+ worker), frontend.
# Judge0 runs as a SEPARATE stack (see judge0/README.md), ideally on a separate host,
# so candidate code never shares a machine or network with your database.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/coding_assessment
      REDIS_URL: redis://redis:6379
      RUN_INLINE_WORKER: "false"
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY_HOPS: "1"
      # Judge0 on the Docker host by default; point this at your Judge0 server.
      JUDGE0_URL: ${JUDGE0_URL:-http://host.docker.internal:2358}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mongo, redis]

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["node", "worker.js"]
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/coding_assessment
      REDIS_URL: redis://redis:6379
      JUDGE0_URL: ${JUDGE0_URL:-http://host.docker.internal:2358}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mongo, redis]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on: [backend]

volumes:
  mongo-data:
